<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pratinjau filter mobile</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #20293a; color: #fff; padding: 16px; }
  iframe { border: 0; background: #fff; border-radius: 8px; width: 390px; height: 760px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
</style>
</head>
<body>
<iframe id="f" src="/katalog.html"></iframe>
<script>
  const fr = document.getElementById('f');
  fr.addEventListener('load', () => {
    setTimeout(() => {
      const d = fr.contentDocument;
      d.querySelector('[data-filter-open]').click();
      d.querySelector('#categoryFilter button:nth-child(2)').click();
      d.querySelector('#filterPanel').scrollTop = 120;
    }, 900);
  });
</script>
</body>
</html>
